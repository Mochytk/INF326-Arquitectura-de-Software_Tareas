# PENDIENTE: la política del cluster exige host NAMESPACE.DOMINIO (grupo-busqueda-avanzada.<dominio>).
# Está fuera de k8s/ para que el CI no lo aplique hasta conocer el dominio; luego moverlo a k8s/.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search
  # annotations:
  #   cert-manager.io/cluster-issuer: <NOMBRE_DEL_CLUSTERISSUER>
spec:
  ingressClassName: traefik
  # tls:
  #   - hosts: [<HOST>]
  #     secretName: search-tls
  rules:
    - host: busqueda.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: search
                port: { number: 8000 }
