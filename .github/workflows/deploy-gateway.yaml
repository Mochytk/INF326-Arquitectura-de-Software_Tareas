name: Desplegar gateway

on:
  push:
    branches: [main]
    paths: [Tarea_Unidad_6_UI/**, .github/workflows/deploy-gateway.yaml]

env:
  IMAGE: ghcr.io/mochytk/busqueda-gateway
  NAMESPACE: grupo-busqueda-avanzada

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm test
        working-directory: Tarea_Unidad_6_UI/gateway

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: Tarea_Unidad_6_UI/gateway
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Configurar kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Aplicar manifiestos
        working-directory: Tarea_Unidad_6_UI
        run: |
          sed -i "s#${IMAGE}:latest#${IMAGE}:${GITHUB_SHA}#" k8s/gateway.yaml
          kubectl -n "$NAMESPACE" apply -f k8s/

      - name: Esperar el despliegue
        run: |
          kubectl -n "$NAMESPACE" rollout status deploy/gateway --timeout=300s
          kubectl -n "$NAMESPACE" get pods
