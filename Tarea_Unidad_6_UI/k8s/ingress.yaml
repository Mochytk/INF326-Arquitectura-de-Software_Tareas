# nip.io resuelve cualquier subdominio de <IP>.nip.io a esa IP: sirve de dominio público
# sin DNS propio. La IP es la del LoadBalancer de Traefik
# (kubectl get svc -A | grep traefik). Sin TLS: se accede por http.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
spec:
  ingressClassName: traefik
  rules:
    - host: chat-busqueda.134.199.176.3.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { number: 80 }
